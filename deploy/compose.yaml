name: yulin-history

services:
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      app:
        ipv4_address: 172.30.0.2
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      YULIN_ENV_FILE: /run/secrets/backend.env
    secrets:
      - source: backend_env
        target: backend.env
    volumes:
      - yulin_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      start_period: 30s
      retries: 3
    networks:
      app:
        ipv4_address: 172.30.0.3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 6s
      start_period: 20s
      retries: 3
    networks:
      app:
        ipv4_address: 172.30.0.4
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  backend_env:
    file: ${BACKEND_ENV_FILE:-../.env.production}

networks:
  app:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  yulin_data:
  caddy_data:
  caddy_config:
